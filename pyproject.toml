[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "any2jpg"
version = "0.3.0b1"
description = "Converte qualsiasi immagine in JPG, con controllo di qualità e metadati"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Mauro Liistro" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]
dependencies = [
    "Pillow>=11.3",       # include il supporto AVIF
    "pillow-heif>=0.18",  # HEIC/HEIF
    "PySide6>=6.5",
]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/mliistro-beep/any2jpg"
Issues = "https://github.com/mliistro-beep/any2jpg/issues"

[project.gui-scripts]
any2jpg = "any2jpg.gui:main"

[tool.setuptools]
packages = ["any2jpg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
